<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>{{title}}</title>
  <style>
    /* 基础复位与全局样式 */
    * { 
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      
    }
    body { 
      font-family: "Microsoft YaHei", sans-serif;
      padding: 20px;
      background: url("{{_res_path}}/help/imgs/{{bg}}") no-repeat center center;
    }
    .container { 
      border-radius: 15px; 
      overflow: hidden; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
      position: relative;
    }
    .copyright { 
      text-align: center; color: #fff; 
      padding: 10px; background: rgba(0,0,0,0.5); 
      font-size: 14px; 
    }
  </style>
  {{block 'css'}}{{/block}}
</head>
<body {{@sys?.scale}}>
  <div class="container" id="container">
    {{block 'main'}}{{/block}}
    <div class="copyright">Generated by Yunzai-Bot & glc-Plugin</div>
  </div>
</body>
</html>
