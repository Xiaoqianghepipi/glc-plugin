{{extend defaultLayout}}

{{block 'css'}}
<link rel="stylesheet" type="text/css" href="{{_res_path}}memorial/index.css" />
{{/block}}

{{block 'main'}}
<div class="memorial-card">
  <div class="title">归龙潮扫墓计时</div>
  <div class="subtitle">从 {{targetDate}} 到现在，已经过去</div>

  <div class="days-wrap">
    <span class="days">{{days}}</span>
    <span class="days-unit">天</span>
  </div>

  <div class="detail">{{hours}} 小时 {{minutes}} 分钟 {{seconds}} 秒</div>
  <div class="now">统计时间：{{nowText}}</div>
</div>
{{/block}}
