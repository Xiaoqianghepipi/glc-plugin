<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>{{title}}</title>
  <link rel="stylesheet" type="text/css" href="{{_res_path}}/help/index.css" />
</head>
<style>
    .container {
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    position: relative;
    background: url("{{_res_path}}/help/imgs/{{bg}}") no-repeat center center;
    background-size: cover;
  }
</style>
<body>
  <div class="container" id="container" {{scaleStyle}}>
    <div class="help-wrapper">
      <div class="header">
        <div class="title">{{helpCfg.title}}</div>
      </div>

      <div class="content">
        {{each helpGroup group}}
        <div class="group-box">
          <div class="group-title">{{group.group}}</div>
          <div class="command-list" style="grid-template-columns: repeat({{colCount}}, 1fr);">
            {{each group.list item}}
            <div class="command-item">
              <div class="cmd-title">{{item.title}}</div>
              <div class="cmd-desc">{{item.desc}}</div>
            </div>
            {{/each}}
          </div>
        </div>
        {{/each}}
      </div>
      <div class="copyright">Generated by Yunzai & {{helpCfg.pluginVersion}}</div>
    </div>
  </div>
</body>
</html>
