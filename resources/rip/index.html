{{extend defaultLayout}}

{{block 'css'}}
<link rel="stylesheet" type="text/css" href="{{_res_path}}rip/index.css" />
<style>
  .container {
    background: url("{{_res_path}}rip/imgs/background.jpg") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
  }

  .container::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: inherit;
    background-size: cover;
    background-attachment: fixed;
    filter: blur(8px);
    z-index: -1;
  }

  .container > .copyright {
    display: none;
  }
</style>
{{/block}}

{{block 'main'}}
<div class="rip-card">
  <div class="title">🕯归龙潮🕯</div>
  <div class="game-logo"><img src="{{_res_path}}rip/imgs/game-logo.png" alt="归龙潮图标" /></div>
  <div class="subtitle">从归龙潮宣布停运（{{targetDate}}）到现在，已经过去</div>

  <div class="days-wrap">
    <span class="days">{{days}}</span>
    <span class="days-unit">天</span>
  </div>

  <div class="detail">{{hours}} 小时 {{minutes}} 分钟 {{seconds}} 秒</div>
  <div class="now">生成时间：{{nowText}}</div>
  <div class="plugin-info">{{@sys.copyright}}</div>
</div>
{{/block}}
